{% load lumiere %}
<div class="card product-card h-100 border-0">
  <div class="product-img ratio ratio-4x5">
    <img src="{{ product.image_url }}" alt="{{ product.name }}" loading="lazy">
    {% if not product.in_stock %}<span class="badge text-bg-secondary sold-out">Sold out</span>{% endif %}
  </div>
  <div class="card-body px-0 pt-2 pb-0">
    <div class="small text-secondary">{{ product.brand }}</div>
    <a href="{% url 'catalog:detail' product.pk %}" class="product-name stretched-link">{{ product.name }}</a>
    <div class="d-flex justify-content-between align-items-center mt-1">
      <span class="fw-semibold">${{ product.price }}</span>
      <span class="color-dots">{% for color in product.color_list %}<span class="dot" style="background:{{ color|swatch }}" title="{{ color }}"></span>{% endfor %}</span>
    </div>
  </div>
</div>
